<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ea"><title>海岛衣橱 · Ruby 的三亚手记</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#wardrobe"><span class="shell">❋</span> 海岛衣橱 <em>Island Wardrobe</em></a><nav><button id="homeTab" class="on">旅行衣橱</button><button id="notesTab">我的手记</button></nav></header>
<main id="wardrobe"><section class="hero"><div class="intro"><div class="kicker"><i></i> SANYA &nbsp; / &nbsp; APRIL 2027</div><h1>四月的<br><span>海岛衣橱</span></h1><p class="script">Ruby’s island diary</p><p class="desc">选一身比基尼，走进我想象中的三亚。<br>等真的抵达，再把那天的自己留在这里。</p><button class="primary" id="enter">走进这片海 <b>↗</b></button></div>
<div class="collage"><div class="backpaper"></div><div class="postmark">SANYA<br><small>H A I N A N</small></div><button class="polaroid" id="heroPhoto"><span class="tape"></span><img id="heroImg" src="shore.jpg" alt="想象中的三亚海岸"><span class="caption"><em id="enTitle">By the sea</em><small id="heroNum">01 / 04</small></span></button><button class="swatch" id="swatch" aria-label="进入当前穿搭的场景"><canvas id="bigSuit" width="420" height="356"></canvas><span id="hLabel"></span></button></div></section>
<section class="collection"><div class="sectionhead"><h2>我的旅行衣橱 <em>The looks</em></h2><small>四套穿搭 · 四种想象</small></div><div id="cards"></div></section></main>
<main id="journal" hidden><div class="kicker"><i></i> RUBY’S TRAVEL JOURNAL</div><h1 class="journalTitle">我的手记</h1><p class="desc">把照片里看不见的风、温度和心情也记下来。</p><label class="bookSelect">翻看穿搭<select id="bookLook"></select></label><div id="entries"></div></main>
<footer><span>Ruby’s island diary</span><span>三亚 · 二〇二七年四月</span></footer>
<dialog id="scene" aria-labelledby="sceneTitle"><div class="sceneBg"><video id="livingScene" muted loop playsinline preload="none" aria-hidden="true"></video></div><div class="sceneTools"><button class="glass" id="back">← 回到衣橱</button><div class="sceneOptions"><button class="glass" id="motion" aria-pressed="false">播放动态</button><button class="glass" id="sound" aria-pressed="false">开启环境音 ♪</button></div></div><div class="sceneCopy"><div class="kicker" id="sceneKicker"></div><h2 id="sceneTitle"></h2><p id="sceneText"></p><div class="actions"><button class="light" id="record">记下这一刻 ＋</button><button class="glass" id="next">下一处 →</button></div></div></dialog>
<dialog id="editor"><form id="memoryForm"><div class="formhead"><h2>写一篇手记</h2><button type="button" id="cancel" aria-label="关闭">×</button></div><label>关联穿搭<select id="look"></select></label><label>记在哪一页<select id="phase"><option value="before">出发前的想象</option><option value="after">抵达后的回忆</option></select></label><label><span id="noteLabel">此刻的想象</span><textarea id="note" rows="4" maxlength="2000" placeholder="在船头站了一会儿，我最想记住的是……"></textarea></label><label>旅行照片（选填）<input id="photo" type="file" accept="image/*"></label><img id="filePreview" alt="所选照片预览" hidden><small>手记仅保存在当前浏览器。</small><p role="status" id="status"></p><button type="submit" class="primary">收进手记 ↗</button></form></dialog><script src="app.js"></script></body></html>
